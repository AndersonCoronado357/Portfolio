# El mismo sitio se publica en ander.acmsy.com (el principal) y en
# ander-v2.acmsy.com (la copia de pruebas). La copia le dice a los buscadores
# que no la indexen, para que en los resultados salga solo el principal.
map $host $robots_copia {
  ander-v2.acmsy.com "noindex, nofollow";
  default "";
}

server {
  listen 80;
  # Vacio en el principal: nginx no manda la cabecera.
  add_header X-Robots-Tag $robots_copia always;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # /health lo consulta el agente de acmsy para saber si el sitio esta en pie.
  location = /health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  # Los archivos con huella en el nombre no cambian nunca: se cachean a saco.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Es una sola pagina: cualquier ruta devuelve el index.
  location / {
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json;
  gzip_min_length 1024;
}
